<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.66" cy="0.5" r="0.8">
      <stop offset="0" stop-color="#11281b"/>
      <stop offset="0.65" stop-color="#05100a"/>
      <stop offset="1" stop-color="#020503"/>
    </radialGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffbf47" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="heap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3d28"/>
      <stop offset="1" stop-color="#050e08"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="2" fill="#000" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- The floodlight high on the right, its beam falling on the heap. -->
  <path d="M396 132 L196 300 L330 300 L430 150 Z" fill="url(#beam)"/>
  <path d="M432 128 V448" stroke="#1b3524" stroke-width="9"/>
  <circle cx="410" cy="132" r="30" fill="#ffbf47" filter="url(#soft)" opacity="0.75"/>
  <path d="M390 118 L430 118 L436 142 L384 142 Z" fill="#ffd98a" stroke="#ffbf47" stroke-width="4" stroke-linejoin="round"/>

  <!-- The heap: low, lumpy, junk sticking out of it. -->
  <path d="M44 448 C60 400 78 392 92 376 C104 362 118 368 130 350 C142 332 160 340 174 318 C186 300 204 306 214 290 C226 272 246 282 262 266 C280 250 296 268 312 262 C330 256 344 280 362 288 C380 296 392 318 408 332 C424 346 440 360 468 448 Z"
        fill="url(#heap)" stroke="#7dff9a" stroke-width="8" stroke-linejoin="round" filter="url(#glow)"/>
  <g fill="none" stroke="#7dff9a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M286 262 L298 214 L332 204"/>
    <path d="M176 318 L156 280"/>
  </g>
  <g fill="none" stroke="#3f8f57" stroke-width="7">
    <circle cx="330" cy="356" r="24"/>
    <rect x="216" y="330" width="40" height="52" rx="4" transform="rotate(12 236 356)"/>
    <path d="M370 400 L420 392"/>
  </g>

  <!-- Deep in the shadow at the foot of the heap, something looks back. -->
  <g filter="url(#glow)">
    <ellipse cx="118" cy="414" rx="10" ry="6" fill="#ff4d3d"/>
    <ellipse cx="146" cy="412" rx="10" ry="6" fill="#ff4d3d"/>
  </g>

  <!-- Camera frame: corners and the recording dot. -->
  <g fill="none" stroke="#7dff9a" stroke-width="9" stroke-linecap="square" opacity="0.8">
    <path d="M36 100 V36 H100"/>
    <path d="M412 36 H476 V100"/>
    <path d="M36 412 V476 H100"/>
    <path d="M476 412 V476 H412"/>
  </g>
  <circle cx="82" cy="82" r="14" fill="#ff3b30" filter="url(#glow)"/>

  <rect width="512" height="512" fill="url(#scan)"/>
</svg>
